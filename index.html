<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Vehicle Log</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f1f5f9;color:#0f172a;padding-bottom:70px}
header{background:#0f766e;color:#fff;padding:12px 14px;position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center}
header h1{font-size:18px;margin:0;flex:1}select,input,textarea,button{font:inherit}
header select{max-width:55%;padding:6px;border-radius:8px;border:0}
main{padding:12px;max-width:800px;margin:auto}.card{background:#fff;border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:0 1px 3px #0002}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:#f8fafc;border-radius:10px;padding:10px}.stat b{display:block;font-size:18px}.stat span{font-size:12px;color:#64748b}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;border-top:1px solid #e2e8f0;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;min-width:0;border:0;background:none;padding:10px 0;font-size:12px;color:#64748b}nav button.on{color:#0f766e;font-weight:700}
.btn{background:#0f766e;color:#fff;border:0;border-radius:8px;padding:9px 14px}.btn2{background:#e2e8f0;color:#0f172a;border:0;border-radius:8px;padding:9px 14px}.del{background:#dc2626;color:#fff;border:0;border-radius:8px;padding:9px 14px}
.row{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid #f1f5f9;cursor:pointer}.row:last-child{border:0}.muted{color:#64748b;font-size:13px}
.tag{font-size:11px;padding:2px 7px;border-radius:9px;background:#e2e8f0}.fuel{background:#dbeafe}.service{background:#dcfce7}.expense{background:#fef3c7}
.over{color:#dc2626;font-weight:700}.due{color:#d97706;font-weight:700}.ok{color:#16a34a}
label{display:block;font-size:13px;color:#475569;margin-top:8px}label input,label select,label textarea{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:8px;margin-top:3px;background:#fff}
dialog{border:0;border-radius:14px;width:min(94vw,480px);padding:16px}dialog::backdrop{background:#0006}
.fab{position:fixed;right:16px;bottom:80px;width:56px;height:56px;border-radius:50%;font-size:28px;background:#0f766e;color:#fff;border:0;box-shadow:0 3px 8px #0004}
.filters{display:flex;gap:6px;margin-bottom:8px}.filters input,.filters select{min-width:0;}.filters input{flex:1;padding:8px;border:1px solid #cbd5e1;border-radius:8px}.filters select{padding:8px;border-radius:8px;border:1px solid #cbd5e1}
h2{font-size:16px;margin:0 0 8px}svg{width:100%;height:auto}
</style></head><body>
<noscript><div style="background:#dc2626;color:#fff;padding:16px;font-size:16px">This app needs JavaScript. Open this file in Chrome (Android) or Safari (iPhone), not in the Google Drive or Files preview.</div></noscript>
<div id="banner" style="display:none;background:#fef3c7;color:#78350f;padding:10px 14px;font-size:14px"></div>
<script>window.__err=function(m){var b=document.getElementById('banner');if(!b)return;b.style.display='block';b.style.background='#fee2e2';b.style.color='#7f1d1d';b.innerHTML='<b>Something went wrong:</b> '+String(m).replace(/</g,'&lt;')+'<br>Try opening this file in Chrome (Android) or Safari (iPhone) instead of a preview viewer.'};window.onerror=function(m){window.__err(m)};</script>
<header><h1>🚙 Vehicle Log</h1><select id="vsel" aria-label="Vehicle"></select></header>
<main id="app"></main>
<button class="fab" id="fab" aria-label="Add">+</button>
<nav><button data-t="dash" class="on">📊<br>Dashboard</button><button data-t="hist">📜<br>History</button><button data-t="trips">🛣️<br>Trips</button><button data-t="rem">⏰<br>Reminders</button><button data-t="veh">🚗<br>Vehicles</button><button data-t="set">⚙️<br>More</button></nav>
<dialog id="dlg"><form id="frm"></form></dialog>
<script>
const KEY='vehicleLog.v1',$=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,10);
const STYPES=['Tyre rotation','Balancing','Alignment','Oil change','Tyres','Brakes','Battery','Licence/roadworthy','Odometer reading','Other'];
const ETYPES=['Insurance','Licence','Parking','Tolls','Car wash','Accessories','Repairs','Finance','Other'];
const N=v=>'N$'+(+v||0).toLocaleString('en-ZA',{minimumFractionDigits:2,maximumFractionDigits:2});
const today=()=>new Date().toISOString().slice(0,10);
function seed(){const v=uid();return{cur:v,vehicles:[{id:v,name:'Isuzu MU-X',reg:'',year:'',notes:'Seeded from West Coast Wheel & Tyre invoices (Swakopmund)'}],entries:[
{id:uid(),v,kind:'service',date:'2024-11-23',type:'Tyres',odo:'',cost:18900.04,workshop:'West Coast Wheel & Tyre, Swakopmund',notes:'5× Sailun Terramax RT 265/60R18 + balancing ×5 + valves + alignment. Inv 00018118 (ref ISUZU MUX)'},
{id:uid(),v,kind:'service',date:'2024-11-30',type:'Other',odo:'',cost:2500,workshop:'West Coast Wheel & Tyre, Swakopmund',notes:'Steel Mate TPMS 4-sensor. Inv 00018259'},
{id:uid(),v,kind:'service',date:'2025-10-04',type:'Balancing',odo:'',cost:1750.02,workshop:'West Coast Wheel & Tyre, Swakopmund',notes:'Balancing ×4 + alignment. Inv 00023999, ref N 65826 W — vehicle NOT confirmed on invoice'},
{id:uid(),v,kind:'service',date:'2026-01-03',type:'Alignment',odo:'',cost:400,workshop:'West Coast Wheel & Tyre, Swakopmund',notes:'Alignment. Inv 00025862 — vehicle NOT confirmed on invoice'},
{id:uid(),v,kind:'service',date:'2026-10-31',type:'Odometer reading',odo:162409,cost:0,workshop:'',notes:'Odometer reading'}],
reminders:[{id:uid(),v,title:'Tyre rotation',type:'Tyre rotation',km:10000,months:6,lastDate:'2025-10-04',lastOdo:143000,note:'Estimated – probably done unbilled with West Coast balancing, inv 00023999'},{id:uid(),v,title:'Oil change',type:'Oil change',km:10000,months:'',lastDate:'',lastOdo:160000}]}}
let STORE=null;try{const t='__t';window.localStorage.setItem(t,'1');window.localStorage.removeItem(t);STORE=window.localStorage}catch(e){}
function warn(m){const b=$('#banner');b.style.display='block';b.innerHTML=m}
if(!STORE)warn('⚠️ This viewer blocks saving. You can look around, but <b>nothing will be kept</b>. Download the file and open it in Chrome (Android) or Safari (iPhone).');
let D;try{D=JSON.parse(STORE&&STORE.getItem(KEY))}catch(e){}if(!D||!D.vehicles){D=seed();D.firstRun=true}
const save=()=>{if(!STORE)return;try{STORE.setItem(KEY,JSON.stringify(D))}catch(e){warn('⚠️ Could not save: '+e.message+'. Export a backup.')}};save();
let tab='dash',filt={q:'',k:'all'};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ent=()=>D.entries.filter(e=>e.v===D.cur).sort((a,b)=>b.date.localeCompare(a.date)||(+b.odo||0)-(+a.odo||0));
const cost=e=>e.kind==='fuel'?(+e.litres||0)*(+e.price||0):(+e.cost||0);
function maxOdo(){return Math.max(0,...ent().map(e=>+e.odo||0),...(D.trips||[]).filter(t=>t.v===D.cur).map(t=>+t.endOdo||0))}
function fuelStats(){const f=ent().filter(e=>e.kind==='fuel'&&e.odo).sort((a,b)=>a.odo-b.odo);const pts=[];let last=null,acc=0;
for(const e of f){if(last){acc+=+e.litres;if(e.full){const km=e.odo-last.odo;if(km>0)pts.push({date:e.date,l100:acc/km*100,km});acc=0;last=e}}else if(e.full)last=e}
const km=pts.reduce((s,p)=>s+p.km,0),l=pts.reduce((s,p)=>s+p.l100*p.km/100,0);return{pts,avg:km?l/km*100:null}}
function remStatus(r){const all=ent().filter(e=>e.kind==='service'&&(e.type===r.type||(e.notes||'').toLowerCase().includes(r.type.toLowerCase())));
let ld=r.lastDate,lo=+r.lastOdo||0;if(all[0]){if(!ld||all[0].date>ld)ld=all[0].date;const o=Math.max(...all.map(e=>+e.odo||0));if(o>lo)lo=o}
const out={ld,lo,parts:[],st:'ok'},cur=maxOdo();
if(r.km&&lo){const due=lo+ +r.km,left=due-cur;out.parts.push(`due at ${due.toLocaleString()} km (${left<0?Math.abs(left).toLocaleString()+' km overdue':left.toLocaleString()+' km left'})`);if(left<0)out.st='over';else if(left<1000&&out.st!='over')out.st='due'}
else if(r.km)out.parts.push(`every ${(+r.km).toLocaleString()} km — no odometer recorded yet`);
if(r.months&&ld){const d=new Date(ld);d.setMonth(d.getMonth()+ +r.months);const days=Math.round((d-new Date())/864e5);out.parts.push(`due ${d.toISOString().slice(0,10)} (${days<0?-days+' days overdue':days+' days'})`);if(days<0)out.st='over';else if(days<30&&out.st!='over')out.st='due'}
else if(r.months)out.parts.push(`every ${r.months} months — no date yet`);return out}
function chart(data,label,fmt){if(!data.length)return`<p class="muted">No data for ${label} yet.</p>`;const W=340,H=150,P=30,mx=Math.max(...data.map(d=>d.y))||1,bw=(W-P)/data.length;
return`<svg viewBox="0 0 ${W} ${H+20}" role="img" aria-label="${label}"><line x1="${P}" y1="${H}" x2="${W}" y2="${H}" stroke="#cbd5e1"/>`+data.map((d,i)=>{const h=d.y/mx*(H-20);return`<rect x="${P+i*bw+2}" y="${H-h}" width="${Math.max(bw-4,2)}" height="${h}" rx="3" fill="#0f766e"><title>${d.x}: ${fmt(d.y)}</title></rect><text x="${P+i*bw+bw/2}" y="${H+14}" font-size="9" text-anchor="middle" fill="#64748b">${d.x}</text>`}).join('')+`<text x="2" y="12" font-size="9" fill="#64748b">${fmt(mx)}</text></svg>`}
function line(pts){if(pts.length<2)return'<p class="muted">Need at least 3 full-tank fill-ups with odometer readings for a consumption chart.</p>';const W=340,H=140,P=30,ys=pts.map(p=>p.l100),mn=Math.min(...ys)*.9,mx=Math.max(...ys)*1.1;
const xy=pts.map((p,i)=>[P+i*(W-P-10)/(pts.length-1),H-(p.l100-mn)/(mx-mn||1)*(H-10)]);return`<svg viewBox="0 0 ${W} ${H+10}"><polyline fill="none" stroke="#0f766e" stroke-width="2" points="${xy.map(a=>a.join(',')).join(' ')}"/>${xy.map((a,i)=>`<circle cx="${a[0]}" cy="${a[1]}" r="3" fill="#0f766e"><title>${pts[i].date}: ${pts[i].l100.toFixed(1)} L/100km</title></circle>`).join('')}<text x="2" y="10" font-size="9" fill="#64748b">${mx.toFixed(1)}</text><text x="2" y="${H}" font-size="9" fill="#64748b">${mn.toFixed(1)}</text></svg>`}
function dash(){return firstRunBanner()+dash0()}
function dash0(){const E=ent(),tot=E.reduce((s,e)=>s+cost(e),0),by=k=>E.filter(e=>e.kind===k).reduce((s,e)=>s+cost(e),0),fs=fuelStats(),odos=E.map(e=>+e.odo).filter(Boolean),dist=odos.length>1?Math.max(...odos)-Math.min(...odos):0,lit=E.filter(e=>e.kind==='fuel').reduce((s,e)=>s+(+e.litres||0),0);
const m={};const now=new Date();for(let i=11;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);m[d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')]=0}E.forEach(e=>{const k=e.date.slice(0,7);if(k in m)m[k]+=cost(e)});
const rs=D.reminders.filter(r=>r.v===D.cur).map(r=>[r,remStatus(r)]).filter(x=>x[1].st!=='ok');
return`${rs.length?`<div class="card"><h2>⚠️ Attention</h2>${rs.map(([r,s])=>`<div class="${s.st}">${esc(r.title)}: ${s.parts.join('; ')}</div>`).join('')}</div>`:''}
<div class="card"><h2>Totals</h2><div class="grid"><div class="stat"><b>${N(tot)}</b><span>Total spent</span></div><div class="stat"><b>${N(by('fuel'))}</b><span>Fuel</span></div><div class="stat"><b>${N(by('service'))}</b><span>Service & maintenance</span></div><div class="stat"><b>${N(by('expense'))}</b><span>Other expenses</span></div>
<div class="stat"><b>${fs.avg?fs.avg.toFixed(2):'—'}</b><span>Avg L/100km</span></div><div class="stat"><b>${dist?N(tot/dist):'—'}</b><span>Cost per km</span></div><div class="stat"><b>${maxOdo()?maxOdo().toLocaleString()+' km':'—'}</b><span>Last odometer</span></div><div class="stat"><b>${lit.toFixed(1)} L</b><span>Fuel bought</span></div></div></div>
<div class="card"><h2>Spending – last 12 months</h2>${chart(Object.entries(m).map(([k,y])=>({x:k.slice(5),y})),'monthly spend',N)}</div>
<div class="card"><h2>Fuel consumption (L/100km)</h2>${line(fs.pts)}</div>
<div class="card"><h2>Recent</h2>${E.slice(0,5).map(rowH).join('')||'<p class="muted">No entries yet. Tap + to add.</p>'}</div>`}
function rowH(e){const t=e.kind==='fuel'?`Fuel ${(+e.litres).toFixed(2)} L${e.full?' (full)':''}`:e.kind==='service'?e.type:e.type||'Expense';
return`<div class="row" data-id="${e.id}"><div><span class="tag ${e.kind}">${e.kind}</span> <b>${esc(t)}</b><div class="muted">${e.date}${e.odo?' · '+(+e.odo).toLocaleString()+' km':''}${e.workshop?' · '+esc(e.workshop):''}</div>${e.notes?`<div class="muted">${esc(e.notes)}</div>`:''}</div><b>${N(cost(e))}</b></div>`}
function hist(){const q=filt.q.toLowerCase(),E=ent().filter(e=>(filt.k==='all'||e.kind===filt.k)&&(!q||JSON.stringify(e).toLowerCase().includes(q)));
return`<div class="filters"><input id="q" placeholder="Search…" value="${esc(filt.q)}"><select id="k">${['all','fuel','service','expense'].map(k=>`<option ${filt.k===k?'selected':''}>${k}</option>`).join('')}</select></div><div class="card">${E.map(rowH).join('')||'<p class="muted">Nothing found.</p>'}<p class="muted">${E.length} entries · ${N(E.reduce((s,e)=>s+cost(e),0))}</p></div>`}
function rem(){const R=D.reminders.filter(r=>r.v===D.cur);return`<div class="card"><h2>Reminders</h2><p class="muted">Based on last matching service entry (or a manual "last done") plus the interval. Km reminders need odometer readings.</p>${R.map(r=>{const s=remStatus(r);return`<div class="row" data-rid="${r.id}"><div><b>${esc(r.title)}</b><div class="muted">Last: ${s.ld||(s.lo?'date unknown':'never')}${s.lo?' @ '+s.lo.toLocaleString()+' km':''}</div><div class="${s.st}">${s.parts.join('; ')||'No interval'}</div>${r.note?`<div class="muted">${esc(r.note)}</div>`:''}</div><span class="${s.st}">${s.st==='over'?'OVERDUE':s.st==='due'?'DUE SOON':'OK'}</span></div>`}).join('')||'<p class="muted">None.</p>'}</div><button class="btn" id="addR">+ Add reminder</button>`}
function veh(){return`<div class="card"><h2>Vehicles</h2>${D.vehicles.map(v=>`<div class="row" data-vid="${v.id}"><div><b>${esc(v.name)}</b><div class="muted">${esc([v.reg,v.year].filter(Boolean).join(' · '))} ${D.entries.filter(e=>e.v===v.id).length} entries</div></div>${v.id===D.cur?'✅':''}</div>`).join('')}</div><button class="btn" id="addV">+ Add vehicle</button>`}
function sett(){return`<div class="card" id="move"><h2>📦 Move data from old file</h2><p class="muted">This web app keeps its own storage, separate from the old vehicle-log.html file. To bring your records across:</p><ol style="padding-left:18px;font-size:14px"><li>Open the <b>old file</b> in Chrome (Downloads) → More → <b>Export JSON backup</b>.</li><li>Come back here → tap <b>Import backup</b> below and pick that file (it's in Downloads).</li></ol><button class="btn" type="button" onclick="pickImport()">Import backup</button></div><div class="card"><h2>Backup & export</h2><p class="muted">Data is stored only in this browser on this device. Export a backup regularly.</p><p><button class="btn" id="exJ">Export JSON backup</button></p><p><button class="btn2" id="exC">Export CSV (all vehicles)</button></p><p><label>Import JSON backup (replaces all data)<input type="file" id="imJ" accept=".json,application/json"></label></p><p><button class="del" id="wipe">Delete all data</button></p></div>`+homeCard()+`<div class="card" id="help"><h2>Help: automatic trips with MacroDroid (Android)</h2><ol style="padding-left:18px;font-size:14px;line-height:1.5">
<li>Keep this file at <b>Download/vehicle-log.html</b> and open it in <b>Chrome</b> once (this is where your data lives).</li>
<li>Install <b>MacroDroid</b> from the Play Store.</li>
<li>New macro → Trigger: <b>Connectivity → Bluetooth event → Device connected</b> → pick your car radio.</li>
<li>Action: <b>Applications → Open website / HTTP GET → Open website</b>, URL: <code>file:///sdcard/Download/vehicle-log.html#trip-start</code> (choose Chrome as browser if asked). <b>Installed web app:</b> use your https address instead, e.g. <code>https://gideon512.github.io/vehicle-log/#trip-start</code> (and <code>…/vehicle-log/#trip-end</code> for disconnected) — this is more reliable than file://. Name it "Trip start".</li>
<li>Second macro → Trigger: Bluetooth <b>Device disconnected</b> → same radio. Action: open <code>file:///sdcard/Download/vehicle-log.html#trip-end</code>.</li>
<li>Set <b>Home</b> above. Radio off away from home = a stop (trip paused); radio on again = trip resumes. Radio off at home = trip ends and you'll be asked Personal or Company. If you're not looking, the end time is kept and the question waits on the Trips tab.</li></ol>
<p class="muted"><b>Limits:</b> GPS only counts while this page is open in front with the screen on (the app asks to keep the screen awake). If the phone locks or you switch apps, GPS stops; use the odometer km instead. Some Android/Chrome versions block opening <code>file://</code> links from other apps; if MacroDroid shows an error or Chrome opens a blank page, use the Start/End buttons, or host the file at an https address. Diesel litres and cost are <b>estimates</b> (km × average L/100km × last price). Data is stored only in Chrome on this phone — export backups.</p></div><div class="card muted">Install: in Chrome use ⋮ → "Add to Home screen"; in Safari use Share → "Add to Home Screen".</div>`}
function render(){$('#vsel').innerHTML=D.vehicles.map(v=>`<option value="${v.id}" ${v.id===D.cur?'selected':''}>${esc(v.name)}</option>`).join('')||'<option>No vehicle</option>';
$('#app').innerHTML={dash,hist,trips,rem,veh,set:sett}[tab]();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));$('#fab').style.display=['dash','hist'].includes(tab)?'':'none';bind()}
function bind(){bindTrips();document.querySelectorAll('[data-id]').forEach(r=>r.onclick=()=>entryForm(D.entries.find(e=>e.id===r.dataset.id)));
document.querySelectorAll('[data-rid]').forEach(r=>r.onclick=()=>remForm(D.reminders.find(e=>e.id===r.dataset.rid)));
document.querySelectorAll('[data-vid]').forEach(r=>r.onclick=()=>vehForm(D.vehicles.find(e=>e.id===r.dataset.vid)));
const q=$('#q');if(q){q.oninput=()=>{filt.q=q.value;const p=q.selectionStart;render();$('#q').focus();$('#q').setSelectionRange(p,p)};$('#k').onchange=e=>{filt.k=e.target.value;render()}}
$('#addR')&&($('#addR').onclick=()=>remForm());$('#addV')&&($('#addV').onclick=()=>vehForm());
if($('#exJ')){$('#exJ').onclick=()=>dl('vehicle-log-backup-'+today()+'.json',JSON.stringify(D,null,1),'application/json');
$('#exC').onclick=()=>{const c=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"',vn=id=>(D.vehicles.find(v=>v.id===id)||{}).name;dl('vehicle-log-'+today()+'.csv',['vehicle,kind,date,odometer_km,type,litres,price_per_l,full_tank,cost_nad,workshop,notes'].concat(D.entries.map(e=>[vn(e.v),e.kind,e.date,e.odo,e.type,e.litres,e.price,e.full?'yes':'',cost(e).toFixed(2),e.workshop,e.notes].map(c).join(','))).join('\n'),'text/csv')};
$('#imJ').onchange=e=>doImport(e.target.files[0]);
$('#wipe').onclick=()=>{if(confirm('Delete ALL vehicles and records?')){D={cur:null,vehicles:[],entries:[],reminders:[]};save();render()}}}}
function dl(n,t,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()}
function form(html,onSave,onDel,onCancel){$('#frm').innerHTML=html+`<div style="display:flex;gap:8px;margin-top:14px"><button class="btn" value="save" style="flex:1">Save</button><button class="btn2" value="cancel" formnovalidate>Cancel</button>${onDel?'<button class="del" value="del" formnovalidate>Delete</button>':''}</div>`;
$('#frm').onsubmit=ev=>{ev.preventDefault();const v=lastBtn;if(v==='save'){const o={};$('#frm').querySelectorAll('[name]').forEach(el=>{if(el.type==='checkbox'){if(el.checked)o[el.name]='on'}else o[el.name]=el.value});onSave(o);save();render()}else if(v==='del'){if(!confirm('Delete?'))return;onDel();save();render()}closeDlg();if(v==='cancel'&&onCancel)onCancel()};openDlg()}
let lastBtn='';document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('#frm button');if(b)lastBtn=b.value||''},true);
function openDlg(){lastBtn='';const d=$('#dlg');if(d.showModal)d.showModal();else{d.setAttribute('open','');d.style.cssText='position:fixed;top:5vh;left:3vw;z-index:20;max-height:90vh;overflow:auto;box-shadow:0 0 0 100vmax #0006'}}
function closeDlg(){const d=$('#dlg');if(d.close&&d.open)d.close();else d.removeAttribute('open')}

function odoDiff(a,b){const so=parseFloat(a),eo=parseFloat(b);return(!isNaN(so)&&!isNaN(eo)&&so>0&&eo>=so)?Math.round((eo-so)*10)/10:null}

function kmLive(gpsKm){const fm=$('#frm'),km=fm.querySelector('[name=km]'),so=fm.querySelector('[name=startOdo]'),eo=fm.querySelector('[name=endOdo]'),src=fm.querySelector('[name=kmSource]');if(!km||!so||!eo)return;

so.addEventListener('input',upd);eo.addEventListener('input',upd);if(src)src.addEventListener('change',upd);
if(!(parseFloat(km.value)>0))upd()}
function fixKm(){let n=0;(D.trips||[]).forEach(t=>{if(!(+t.km>0)){const d=odoDiff(t.startOdo,t.endOdo);if(d!=null&&d>0){t.km=d;t.kmSource='Odometer';n++}}});return n}

let lastRaw=null,lastRec=null;
function startGPS(){if(watchId!==null||!navigator.geolocation||!D.running||!D.running.gps)return;lastPos=null;lastRaw=null;lastRec=null;
watchId=navigator.geolocation.watchPosition(p=>{const R=D.running;if(!R||R.ending||R.paused)return;const c=p.coords,now=p.timestamp||Date.now();R.track=R.track||[];
let kmh=(c.speed!=null&&!isNaN(c.speed)&&c.speed>=0)?c.speed*3.6:null;
if(kmh==null&&lastRaw){const dt=(now-lastRaw.t)/1000;if(dt>0)kmh=hav(lastRaw,c)*1000/dt*3.6}lastRaw={latitude:c.latitude,longitude:c.longitude,t:now};R.curKmh=kmh;

if(lastPos){const d=hav(lastPos,c);if(d*1000>=Math.max(10,c.accuracy)){R.gpsKm=(R.gpsKm||0)+d;lastPos={latitude:c.latitude,longitude:c.longitude}}}else lastPos={latitude:c.latitude,longitude:c.longitude};
if(!lastRec||now-lastRec.t>=5000||hav(lastRec,c)*1000>=25){R.track.push([now,+c.latitude.toFixed(6),+c.longitude.toFixed(6),kmh==null?null:Math.round(kmh*10)/10,Math.round(c.accuracy)]);lastRec={latitude:c.latitude,longitude:c.longitude,t:now};if(R.track.length>4000)R.track=thin(R.track)}
R.gpsStatus='ok';if(Date.now()-lastSaveT>5000){lastSaveT=Date.now();save();checkStore()}liveUpd()},
e=>{if(D.running){D.running.gpsStatus=e.code===1?'location permission denied — allow location for Chrome':'GPS error: '+e.message;liveUpd()}},{enableHighAccuracy:true,maximumAge:3000,timeout:30000})}
function thin(tr){return tr.filter((p,i)=>i%2===0||i===tr.length-1)}
function storeSize(){try{return JSON.stringify(D).length}catch(e){return 0}}
function checkStore(){let n=storeSize(),guard=0;const LIM=3500000;
while(n>LIM&&guard++<300){const old=D.trips.filter(t=>t.track&&t.track.length>50).sort((a,b)=>a.start-b.start)[0];if(!old)break;old.track=thin(old.track);old.thinned=true;n=storeSize()}
if(guard>0)save();if(n>LIM)warn('⚠️ Storage almost full ('+(n/1e6).toFixed(1)+' MB). Export a backup and delete old trips.')}
function trackStats(t){const tr=t.track||[];let mx=0,dist=0,mv=0;for(let i=1;i<tr.length;i++){const a=tr[i-1],b=tr[i],dt=(b[0]-a[0])/1000,d=hav({latitude:a[1],longitude:a[2]},{latitude:b[1],longitude:b[2]});const v=b[3]!=null?b[3]:(dt>0?d*3600/dt:0);if(v>mx)mx=v;if(v>3&&dt>0&&dt<120){mv+=dt;dist+=d}}
return{max:mx,avg:mv?dist/(mv/3600):0,moving:mv*1000}}
function speedSvg(t){const tr=(t.track||[]).filter(p=>p[3]!=null);if(tr.length<2)return'<p class="muted">No GPS speed data for this trip.</p>';

(t.stops||[]).forEach(s=>{const a=X(s.at),b=X(s.resumed||t1);g+=`<rect x="${a}" y="4" width="${Math.max(2,b-a)}" height="${H-B-4}" fill="#fde68a" opacity=".7"><title>Stop ${esc(stopTxt(s))}</title></rect>`});

function trackHtml(t){const tr=t.track||[];if(!tr.length)return'<p class="muted">No GPS track recorded for this trip.</p>';const s=trackStats(t),f=tr[0],l=tr[tr.length-1];
return`<div class="grid"><div class="stat"><b>${s.max.toFixed(0)} km/h</b><span>Max speed</span></div><div class="stat"><b>${s.avg.toFixed(0)} km/h</b><span>Avg moving speed (${dur(s.moving)})</span></div></div><h2 style="margin-top:10px">Speed</h2>${speedSvg(t)}<h2>Route</h2>${routeSvg(t)}

<button type="button" class="btn2" id="gpxBtn">Export GPX</button> <span class="muted">${tr.length} points${t.thinned?' (thinned to save space)':''}</span>`}
function gpx(t){const x=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');const iso=ms=>new Date(ms).toISOString();

(t.stops||[]).filter(s=>s.lat!=='').map(s=>`<wpt lat="${s.lat}" lon="${s.lon}"><time>${iso(s.at)}</time><name>${x('Stop '+stopTxt(s))}</name></wpt>`).join('')+
`<trk><name>${x((t.use||'')+' '+(t.purpose||''))}</name><trkseg>`+(t.track||[]).map(p=>`<trkpt lat="${p[1]}" lon="${p[2]}"><time>${iso(p[0])}</time>${p[3]!=null?`<extensions><speed>${(p[3]/3.6).toFixed(2)}</speed></extensions>`:''}</trkpt>`).join('')+`</trkseg></trk></gpx>`}

function doImport(f){if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!d.vehicles||!d.entries)throw 0;if(confirm('Replace all current data with this backup ('+d.vehicles.length+' vehicles, '+d.entries.length+' records, '+((d.trips||[]).length)+' trips)?')){d.reminders=d.reminders||[];delete d.firstRun;D=d;migrate();save();tab='dash';render();toast('Backup imported')}}catch(x){alert('Not a valid backup file')}})}

setInterval(()=>reg.update().catch(()=>{}),3600000)}).catch(()=>{});
let rl=false;const hadCtl=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(rl||!hadCtl)return;rl=true;location.reload()})})}

// ===== Home coordinates v2: text inputs, comma decimals, paste, autosave, no clobber =====
function pNum(v){v=String(v==null?'':v).trim().replace(/[−–—]/g,'-').replace(/\s+/g,'');if(/^[-+]?\d+,\d+$/.test(v))v=v.replace(',','.');if(!/^[-+]?\d+(\.\d+)?$/.test(v))return NaN;return parseFloat(v)}
function pPair(s){s=String(s||'').trim().replace(/[−–—]/g,'-');let m=s.match(/^([-+]?\d+(?:[.,]\d+)?)\s*[;,]?\s+([-+]?\d+(?:[.,]\d+)?)$/)||s.match(/^([-+]?\d+(?:\.\d+)?)\s*[,;]\s*([-+]?\d+(?:\.\d+)?)$/);if(!m)return null;const a=pNum(m[1]),b=pNum(m[2]);return isNaN(a)||isNaN(b)?null:[a,b]}
let homeMsg='';
function homeCard(){const H=D.home||{};const f6=x=>(+x).toFixed(6);
return`<div class="card" id="homeCard"><h2>🏠 Home</h2><p class="muted">Trips start and end at home; stops in between are legs of one trip.</p>
<p id="hNow" style="font-weight:600;font-size:16px">${D.home?'✅ Home set: '+f6(H.lat)+', '+f6(H.lon)+' (radius '+(H.r||300)+' m)':'❌ Home not set'}</p>
<button class="btn" id="hSet" type="button" style="width:100%">📍 Set home to my current location</button>
<label>Paste coordinates<input id="hPaste" type="text" inputmode="text" autocomplete="off" placeholder="-22.639939, 14.531845"></label>
<div class="grid"><label>Latitude<span style="display:flex;gap:6px"><button type="button" class="btn2" id="hLatPM" title="Toggle minus" style="min-width:44px">±</button><input id="hLat" type="text" inputmode="text" autocomplete="off" value="${H.lat!=null?H.lat:''}" placeholder="-22.6784"></span></label>
<label>Longitude<span style="display:flex;gap:6px"><button type="button" class="btn2" id="hLonPM" title="Toggle minus" style="min-width:44px">±</button><input id="hLon" type="text" inputmode="text" autocomplete="off" value="${H.lon!=null?H.lon:''}" placeholder="14.5266"></span></label></div>
<p class="muted" style="font-size:13px">Southern hemisphere (Namibia) latitude is <b>negative</b>, e.g. -22.64. Comma or dot decimals both work. Saves automatically.</p>
<label>Radius (m)<input id="hR" type="text" inputmode="numeric" value="${H.r||300}"></label>
<div id="hMsg">${homeMsg}</div>
<p style="display:flex;gap:8px"><button class="btn2" id="hSave" type="button">Save</button>${D.home?'<button class="del" id="hClr" type="button">Clear</button>':''}</p></div>`}
function homeShow(msg){msg=msg||'';const m=$('#hMsg');if(msg===homeMsg&&m&&m.innerHTML)return;homeMsg=msg;if(m)m.innerHTML=homeMsg}
function saveHome(quiet){const la=pNum($('#hLat')&&$('#hLat').value),lo=pNum($('#hLon')&&$('#hLon').value),r=pNum($('#hR')&&$('#hR').value)||300;
if(isNaN(la)||isNaN(lo)||Math.abs(la)>90||Math.abs(lo)>180){if(!quiet)homeShow('<p class="due">Enter a valid latitude and longitude (e.g. -22.639939 and 14.531845).</p>');return false}
D.home={lat:la,lon:lo,r:r};save();
const now=$('#hNow');if(now)now.textContent='✅ Home set: '+la.toFixed(6)+', '+lo.toFixed(6)+' (radius '+r+' m)';
if(la>0&&lo>=10&&lo<=26)homeShow(`<p class="due">Did you mean <b>${(-la).toFixed(2)}</b> (south)? <button class="btn" type="button" id="hSouth">Yes</button></p>`);else homeShow('<p style="color:#16a34a">Saved ✓</p>');
if(!$('#hClr')){const sv=$('#hSave');if(sv)sv.insertAdjacentHTML('afterend','<button class="del" id="hClr" type="button">Clear</button>')}
return true}
function homeEditing(){const a=document.activeElement;return !!(a&&a.closest&&a.closest('#homeCard')&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))}
(function(){const r0=render;let pend=false;
render=function(){if(homeEditing()){if(!pend){pend=true;const w=()=>{if(homeEditing())return setTimeout(w,700);pend=false;r0()};setTimeout(w,700)}return}return r0.apply(this,arguments)}})();
document.addEventListener('change',e=>{const id=e.target&&e.target.id;if(id==='hLat'||id==='hLon'||id==='hR')saveHome(true);if(id==='hPaste')homePaste()},true);
document.addEventListener('focusout',e=>{const id=e.target&&e.target.id;if(id==='hLat'||id==='hLon'||id==='hR')saveHome(true)},true);
document.addEventListener('input',e=>{if(e.target&&e.target.id==='hPaste'&&pPair(e.target.value))homePaste()},true);
function homePaste(){const p=pPair($('#hPaste').value);if(!p){homeShow('<p class="due">Could not read that. Use e.g. -22.639939, 14.531845</p>');return}$('#hLat').value=p[0];$('#hLon').value=p[1];$('#hPaste').value='';saveHome()}
document.addEventListener('click',e=>{const t=e.target,id=t&&t.id;if(!id)return;
if(id==='hLatPM'||id==='hLonPM'){const i=$(id==='hLatPM'?'#hLat':'#hLon');let v=i.value.trim();i.value=v.charAt(0)==='-'?v.slice(1):'-'+v;saveHome(true)}
else if(id==='hSouth'){$('#hLat').value=-Math.abs(pNum($('#hLat').value));saveHome()}
else if(id==='hSave'){e.stopImmediatePropagation();saveHome()}
else if(id==='hClr'){e.stopImmediatePropagation();D.home=null;save();homeMsg='';r0Safe()}},true);
function r0Safe(){const a=document.activeElement;if(a&&a.blur)a.blur();render()}

// ===== Speed chart v2: x-axis = driving time only; stops collapsed to pin markers =====
function speedSvg(t){const tr=(t.track||[]).filter(p=>p[3]!=null);if(tr.length<2)return'<p class="muted">No GPS speed data for this trip.</p>';
const t0=t.start,t1=Math.max(t.end||0,tr[tr.length-1][0]);
const st=(t.stops||[]).map(s=>({s:s,a:+s.at,b:Math.min(+(s.resumed||t1),t1)})).filter(o=>o.a&&o.b>o.a).sort((x,y)=>x.a-y.a);
const C=ms=>{let off=0;for(const o of st){if(ms<=o.a)break;off+=Math.min(ms,o.b)-o.a}return ms-t0-off};
const parked=st.reduce((n,o)=>n+(o.b-o.a),0),span=Math.max(1,C(t1));
const W=340,H=170,L=28,B=18,TOP=22,mx=Math.max(20,Math.ceil(Math.max.apply(null,tr.map(p=>p[3]))/20)*20);
const X=ms=>L+C(ms)/span*(W-L-4),Y=v=>H-B-v/mx*(H-B-TOP);let g='';
for(let v=0;v<=mx;v+=mx/4)g+=`<line x1="${L}" x2="${W-4}" y1="${Y(v)}" y2="${Y(v)}" stroke="#e2e8f0"/><text x="2" y="${Y(v)+3}" font-size="9" fill="#64748b">${Math.round(v)}</text>`;
let lastX=-99,row=0;
st.forEach((o,i)=>{const x=X(o.a),d=o.b-o.a,lab='P '+dur(d);row=(x-lastX<44)?1-row:0;lastX=x;const ly=row?17:8;
const tip=`Stop ${i+1}: parked ${dur(d)} (${fmtT(o.a)}–${fmtT(o.b)})${o.s.lat!==''&&o.s.lat!=null?' at '+(+o.s.lat).toFixed(5)+', '+(+o.s.lon).toFixed(5):''}`;
g+=`<g><title>${esc(tip)}</title><line x1="${x}" x2="${x}" y1="${ly+3}" y2="${H-B}" stroke="#d97706" stroke-width="1" stroke-dasharray="3,2"/><path d="M${x},${ly+4} c-3.5,-4 -3.5,-8 0,-8 c3.5,0 3.5,4 0,8z" fill="#d97706"/><text x="${Math.min(W-30,x+5)}" y="${ly+1}" font-size="9" fill="#92400e" font-weight="600">${lab}</text></g>`});
let path='',prev=null;tr.forEach(p=>{if(st.some(o=>p[0]>o.a&&p[0]<o.b))return;const gap=prev&&(p[0]-prev[0]>120000&&!st.some(o=>prev[0]<=o.a&&p[0]>=o.b));path+=(path===''||gap?'M':'L')+X(p[0]).toFixed(1)+','+Y(p[3]).toFixed(1)+' ';prev=p});
return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Speed over driving time">${g}<path d="${path}" fill="none" stroke="#0f766e" stroke-width="1.6"/><text x="${L}" y="${H-4}" font-size="9" fill="#64748b">0</text><text x="${W-4}" y="${H-4}" font-size="9" fill="#64748b" text-anchor="end">${dur(span)} driving</text><text x="${(W+L)/2}" y="${H-4}" font-size="9" fill="#64748b" text-anchor="middle">km/h · driving time · 📍P = parked</text></svg>
<p class="muted" style="margin:4px 0 0">${st.length?`Parked/waiting between legs: <b>${dur(parked)}</b> total over ${st.length} stop${st.length>1?'s':''} (${st.map(o=>dur(o.b-o.a)).join(', ')}) · elapsed ${dur(t1-t0)}`:'No stops during this trip.'}</p>`}

$('#vsel').onchange=e=>{D.cur=e.target.value;save();render()};$('#fab').onclick=()=>entryForm();
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});

try{if(D.running){if(!D.running.paused&&!D.running.ending){startGPS();lockOn()}}hook();render();if(D.running&&D.running.ending&&!$('#dlg').open){tab='trips';render()}}catch(e){window.__err(e.message)}
</script></body></html>
